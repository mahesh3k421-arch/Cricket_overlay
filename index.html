<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}

html.ov,body.ov{background:transparent!important;overflow:hidden;width:100%;height:100%}
.wrap{max-width:860px;margin:0 auto;padding:14px}h1{font-size:19px;margin:4px 0 10px}h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.7;margin:14px 0 6px}

button,input{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{font-weight:700}button.a{background:linear-gradient(var(--b1),var(--b2));color:#fff;border-color:var(--b2)}button.c{background:linear-gradient(var(--cu2),var(--cu));color:#2a1600;border-color:var(--cu)}

/* stage 1280x720 */
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff;overflow:hidden}

#bugw{position:absolute;left:40px;right:40px;bottom:22px;height:166px}

.bug .ch i.r4{background:var(--b1);border-color:#fff}.bug .ch i.r6{background:var(--cu);color:#241200;border-color:#fff}.bug .ch i.rW{background:#d11f2f;border-color:#fff}

/* events */
.ev{position:absolute;inset:0;pointer-events:none;display:none}.ev.on{display:block}.ev.out{animation:fadeO .6s both}
.evw{position:absolute;left:0;right:0;top:100px;height:420px;text-align:center;perspective:1200px}
.evw:before{content:"";position:absolute;left:-10%;right:-10%;top:60px;height:300px;background:radial-gradient(ellipse,var(--g) 0,transparent 65%);opacity:.55}
.big{position:relative;display:inline-block;font:italic 900 200px/1 "Arial Black",Impact,sans-serif;letter-spacing:6px;color:var(--t);--d:#08286f;text-shadow:0 1px 0 var(--d),0 2px 0 var(--d),0 3px 0 var(--d),0 4px 0 var(--d),0 5px 0 var(--d),0 6px 0 var(--d),0 7px 0 var(--d),0 8px 0 var(--d),0 9px 0 var(--d),0 10px 0 var(--d),0 11px 0 var(--d),0 12px 0 var(--d),0 26px 40px #000c,0 0 70px var(--g);animation:bigIn 1s both,floaty 2.4s 1s ease-in-out infinite}
.sub{display:inline-block;margin-top:14px;padding:8px 44px;font-weight:900;font-size:26px;letter-spacing:4px;color:#241200;background:linear-gradient(var(--cu2),var(--cu));clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);animation:rise .8s .5s both;box-shadow:0 8px 20px #000a}
.four{--t:#fff;--g:#3d97ff;--d:#0a3a9e}.six{--t:#fff0cf;--g:#ffb13b;--d:#94510f}.wkt{--t:#fff;--g:#ff2f3f;--d:#8b0c18}.fifty{--t:#fff;--g:#4aa3ff;--d:#0a3a9e}
.wkt .big{animation:bigIn 1s both,shake .12s 1s 8}.wkt .sub{background:linear-gradient(#fff,#d5dbe8);color:#8b0c18}.fifty .big{animation:bigIn 1s both,wob 3s 1s ease-in-out infinite}
@keyframes bigIn{0%{transform:rotateX(85deg) translateZ(-700px) scale(.2);opacity:0}55%{transform:rotateX(-9deg) translateZ(70px) scale(1.1);opacity:1}78%{transform:rotateX(4deg) scale(.98)}100%{transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px) rotateX(5deg)}}
@keyframes wob{0%,100%{transform:rotateY(-28deg)}50%{transform:rotateY(28deg)}}

.ring{position:absolute;left:50%;top:150px;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:8px solid var(--g);box-shadow:0 0 40px var(--g);animation:ring 1.2s .35s ease-out both}.ring.r2{animation-delay:.6s;border-color:#fff}
@keyframes ring{from{transform:rotateX(70deg) scale(.1);opacity:1}to{transform:rotateX(70deg) scale(9);opacity:0}}
.sp{position:absolute;left:50%;top:170px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 12px currentColor;animation:burst 1.4s .4s ease-out both}

.ball{position:absolute;left:50%;top:150px;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ff8a7a,#c4161c 45%,#5c0509);box-shadow:inset -8px -10px 18px #0006,0 0 40px #ff9b3d;animation:fly 1.3s ease-in both;z-index:5}
.ball:after{content:"";position:absolute;left:8%;right:8%;top:47%;height:3px;background:#f3e6c8;box-shadow:0 8px #f3e6c8,0 -8px #f3e6c8;border-radius:3px}
@keyframes fly{0%{transform:translate3d(-620px,300px,-400px) scale(.3) rotate(0);opacity:1}70%{transform:translate3d(90px,-120px,300px) scale(2.6) rotate(900deg);opacity:1}100%{transform:translate3d(280px,-330px,900px) scale(5) rotate(1400deg);opacity:0}}
.stp{position:absolute;top:80px;width:16px;height:230px;left:50%;background:linear-gradient(90deg,#f5deb0,#b98a4d);border-radius:6px;box-shadow:0 0 18px #ff2f3f;animation:stump 1.3s .15s ease-out both}

/* player intro */
.in{position:absolute;inset:0;display:none;pointer-events:none}.in.on{display:block}.in.out{animation:fadeO .6s both}
.ic{position:absolute;left:60px;top:70px;width:600px;height:420px}

.ph{position:absolute;left:24px;top:76px;z-index:3;width:170px;height:170px;transform:rotate(45deg);overflow:hidden;border:7px solid var(--b1);background:#dfe6f5;box-shadow:0 0 0 3px var(--cu),0 0 26px #000a;animation:pop .8s .1s both}

.ps{position:absolute;left:170px;top:52px;right:0}
.ps .s{display:flex;justify-content:space-between;height:37px;line-height:37px;margin-bottom:5px;padding:0 26px 0 70px;font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--b2),var(--b1));border-bottom:2px solid var(--cu);clip-path:polygon(0 0,100% 0,96% 100%,0 100%);animation:flipR .7s both}
.ps .s:nth-child(odd){animation-name:flipL}.ps .s span:last-child{color:var(--cu2)}
.nm{position:absolute;left:0;top:262px;width:250px;text-align:center;background:linear-gradient(#fff,#cfd9ef);color:#061a52;font-weight:900;padding:6px 6px 8px;font-size:22px;line-height:1.1;animation:rise .8s .5s both;z-index:4;box-shadow:0 6px 16px #0008;border-bottom:4px solid var(--cu)}

.brk{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 30% 40%,#03102fdd,#010714f2)}
.brk.on{display:block;animation:fadeI .6s both}@keyframes fadeI{from{opacity:0}to{opacity:1}}
.bc{position:absolute;left:50px;top:40px;width:770px;transform:perspective(1800px) rotateY(3deg);transform-origin:left}

.em{position:absolute;left:0;top:-8px;z-index:5}

.res .big{font-size:120px;--g:#d6a85c;background:linear-gradient(180deg,#fff8e3 0,#f3d9a4 45%,#c98a2e 55%,#ffe9b8 100%);-webkit-background-clip:text;background-clip:text}
.res{--g:#d6a85c}
.sub{background:linear-gradient(90deg,transparent,#0d1f52ee 15%,#0d1f52ee 85%,transparent);border-top:1px solid var(--gd);border-bottom:1px solid var(--gd);color:var(--gl);clip-path:none;padding:10px 100px;letter-spacing:8px;font-weight:700;font-size:24px;box-shadow:none}
.wkt .sub{background:linear-gradient(90deg,transparent,#3a0810ee 15%,#3a0810ee 85%,transparent);color:#ffd9dc;border-color:#ff5a66}
.evw:after{content:"";position:absolute;left:0;right:0;top:214px;height:3px;background:linear-gradient(90deg,transparent,#fff,var(--gl),#fff,transparent);opacity:0;animation:streak 1.4s .3s ease-out both}
@keyframes streak{0%{transform:scaleX(0);opacity:1}60%{opacity:1}100%{transform:scaleX(1.2);opacity:0}}
.ring{border-width:2px}.sp{width:4px;height:4px;box-shadow:0 0 10px 3px currentColor}
.tag{background:linear-gradient(#0d1f52,#050d24);color:var(--gl);border:1px solid var(--gd);clip-path:none;border-radius:8px 8px 0 0;letter-spacing:6px;font-size:17px;padding:7px 26px}
.ph{border:5px solid var(--gd);background:#0d1f52;box-shadow:0 0 0 2px #050d24,0 14px 30px #000c}.ph div{background-color:#123a94;color:var(--gl)}
.ps .s{background:linear-gradient(90deg,#0d1f52f2,#123a94cc);border-bottom:1px solid #d6a85c88;clip-path:none;border-radius:0 12px 12px 0;font-weight:700;letter-spacing:.5px}.ps .s span:last-child{color:var(--gl);font-weight:900}
.nm{background:linear-gradient(#0d1f52,#050d24);color:#fff;border:1px solid var(--gd);border-bottom:3px solid var(--gd);letter-spacing:2px;box-shadow:0 12px 26px #000c}.nm small{color:var(--gl);letter-spacing:2px}
.brk{background:radial-gradient(ellipse at 30% 40%,#061436ee,#02060ff5)}
.bh{clip-path:none;background:linear-gradient(90deg,#1f6fe8,#0c3ea6 40%,#050d24);border-bottom:3px solid var(--gd);border-radius:0 18px 0 0;letter-spacing:5px}.bh small{color:var(--gl)}
.r{background:linear-gradient(90deg,#0d1f52f2,#0a2360dd);color:#fff;border-bottom:1px solid #ffffff18}
.r.h{background:#050d24;color:var(--gl);border-bottom:2px solid var(--gd);letter-spacing:2px;font-size:14px}
.r.no{background:linear-gradient(90deg,#2f7dff,#0c3ea6);border-bottom:1px solid var(--gl)}.r b{color:var(--gl)}.r.no b{color:#fff}
.yt{background:#050d24;color:var(--gl);letter-spacing:1px}.ft{background:linear-gradient(90deg,#0c3ea6,#050d24);border-top:2px solid var(--gd);letter-spacing:2px}
.cd{background:linear-gradient(#0d1f52,#050d24);border:1px solid var(--gd);border-radius:14px;box-shadow:0 18px 40px #000c}.cd small{color:var(--gl)}
.dg{font:800 78px/1.1 "Helvetica Neue",Arial,sans-serif;letter-spacing:4px;text-shadow:0 0 26px #2f7dff}
.tl div{background:linear-gradient(#0d1f52,#050d24);border:1px solid #d6a85c66;border-left:3px solid var(--gd);border-radius:8px}.tl div small{color:var(--gl)}
</style></head>

<div class="rp"><div class="coin"><i><img src="${LOGO}"></i><i><img src="${LOGO}"></i></div><div class="cd"><small>${inn?"SECOND INNINGS IN":"PLAY RESUMES IN"}</small><div class="dg" id="dg">${mm(left)}</div></div><div class="tl">${tl.map((t,i)=>`<div style="animation-delay:${.6+i*.12}s"><small>${t[0]}</small>${t[1]}</div>`).join("")}</div></div>`;

else{const o=p.r;S.runs+=x;p.r+=x;p.b++;S.balls++;w.b++;w.r+=x;S.ps.r+=x;S.ps.b++;S.over.push(String(x));if(x===4)p.f++;if(x===6)p.s++;if(x%2)[S.st,S.ns]=[S.ns,S.st];

const end=S.balls===S.tot*6||S.wk>=10||(S.inn===2&&S.runs>=S.target),ten=x!=="Wd"&&S.balls===60&&CFG.b10;
if(x!=="Wd"&&x!=="W"&&S.balls%6===0&&!end){[S.st,S.ns]=[S.ns,S.st];S.over=[];S.bw={n:BOWL[++bi%BOWL.length],b:0,r:0,w:0};if(!ten)after(()=>intro("bowl",S.bw.n))}
else if(x==="W"&&S.balls%6===0){S.over=[];S.bw={n:BOWL[++bi%BOWL.length],b:0,r:0,w:0}}

if(S.inn===2&&end){const won=S.runs>=S.target;fire("res",won?`${S.team} WON BY ${10-S.wk} WICKETS`:S.runs===S.target-1?"MATCH TIED":`${S.opp} WON BY ${S.target-1-S.runs} RUNS`)}

/* CricClubs live data. adapt() converts the feed into S's shape. */
function adapt(j){if(j&&j.runs!=null&&j.bat)return j;window.RAW=j;return null}
