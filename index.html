<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricket Broadcast Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#061029;--sap:#123a8f;--gold:#f2c96b;--ice:#f4f8ff;--mute:#9fb3d9;--red:#ff3f56;--grn:#22d3a0;--vio:#a78bfa;--acc:var(--gold)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--ice)}
#stage{perspective:1800px;position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
/* glass panel */
.glass{position:relative;overflow:hidden;border-radius:26px;border:1.5px solid rgba(255,255,255,.22);
 background:linear-gradient(180deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.04) 38%,rgba(255,255,255,0) 39%),linear-gradient(135deg,rgba(18,58,143,.94),rgba(6,16,41,.96) 70%);
 box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.glass::after{content:"";position:absolute;top:0;bottom:0;width:220px;left:-300px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,70%{left:-300px}100%{left:2000px}}

#bug{position:absolute;left:60px;bottom:56px;width:1800px;height:210px;display:grid;grid-template-columns:560px 1fr 400px;align-items:stretch;transform-origin:50% 100%;transform:translateY(300px) rotateX(45deg);opacity:0;transition:transform 1s cubic-bezier(.2,.9,.2,1),opacity .6s}
#bug.on{transform:none;opacity:1}#bug.on .logo{animation:coin 6s ease-in-out infinite}@keyframes coin{0%,80%,100%{transform:rotateY(0)}90%{transform:rotateY(360deg)}}
.team{display:flex;align-items:center;gap:22px;padding:0 30px;border-right:1px solid rgba(255,255,255,.12);background:linear-gradient(90deg,rgba(242,201,107,.16),transparent)}
.logo{flex:none;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:58px;font-weight:800;color:#2b1c00;background:radial-gradient(circle at 30% 25%,#fff3c9,var(--gold) 55%,#b8862a);box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 -6px 10px rgba(0,0,0,.25);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.tn{font-size:34px;font-weight:700;letter-spacing:.06em;line-height:1;white-space:nowrap}
.vs{font-size:22px;font-weight:500;color:var(--mute);margin-top:6px;letter-spacing:.04em}
.sc{font-size:118px;font-weight:800;line-height:.95;margin-top:6px;text-shadow:0 4px 14px rgba(0,0,0,.5)}
.sc small{font-size:30px;font-weight:600;color:var(--gold);margin-left:14px;letter-spacing:.04em}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:perspective(700px) rotateX(0)}50%{transform:perspective(700px) rotateX(-90deg);color:var(--gold)}100%{transform:perspective(700px) rotateX(0)}}
.mid{padding:20px 28px 14px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:grid;grid-template-columns:1fr 84px 70px 56px 56px 84px;align-items:center;height:46px;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.row span:not(:first-child){text-align:right}
.row.h{height:24px;font-size:19px;color:var(--mute);font-weight:500;letter-spacing:.08em}
.row.bt.st span:first-child{color:var(--gold)}
.row.bt.st span:first-child::after{content:" ●";font-size:20px}
.row .r{font-weight:800;font-size:38px}
.bowl{display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:600;border-top:1px solid rgba(255,255,255,.14);padding-top:8px}
.bowl b{color:var(--gold);font-weight:700}
.balls{display:flex;gap:9px;align-items:center}
.ball{min-width:40px;height:40px;padding:0 6px;border-radius:20px;display:grid;place-items:center;font-size:24px;font-weight:800;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.ball.f{background:var(--grn);color:#02291f}.ball.s{background:var(--vio);color:#1a0a45}.ball.w{background:var(--red);color:#fff}.ball.x{background:#ffd166;color:#3a2600}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 22px 18px 8px;align-content:center}
.chip{border-radius:16px;padding:8px 14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.chip i{display:block;font-style:normal;font-size:18px;letter-spacing:.1em;color:var(--mute);font-weight:500}
.chip b{font-size:44px;font-weight:800;line-height:1.05}
.chip.w{grid-column:span 2}.chip.w b{font-size:30px;color:var(--gold)}
/* event banner */
#ev{position:absolute;left:50%;top:150px;transform:translate(-50%,-160px) rotateX(-75deg) rotateY(25deg) scale(.8);opacity:0;min-width:900px;padding:26px 200px 30px;text-align:center;transition:transform .55s cubic-bezier(.2,1.3,.4,1),opacity .35s}
#ev.on{transform:translate(-50%,0) rotateX(0) rotateY(0) scale(1);opacity:1}
.ball3d{position:absolute;right:46px;top:30px;width:120px;height:120px;border-radius:50%;transform-style:preserve-3d;background:radial-gradient(circle at 32% 28%,#ff9a8f,#d32f2f 45%,#5e0b0b);box-shadow:inset -14px -18px 28px rgba(0,0,0,.55),0 22px 30px rgba(0,0,0,.5);animation:bnc 1.1s ease-in-out infinite alternate}
.ball3d::before{content:"";position:absolute;inset:6px 40px;border-radius:50%;border:5px dotted #fff;animation:seam 1.2s linear infinite}
@keyframes seam{to{transform:rotateY(360deg)}}@keyframes bnc{to{transform:translateY(-22px) scale(1.12)}}
.six .ball3d{animation-duration:.7s;width:140px;height:140px}
.stumps{position:absolute;left:54px;top:30px;width:120px;height:130px}
.stumps i{position:absolute;bottom:0;width:11px;height:105px;border-radius:5px;background:linear-gradient(90deg,#fff,#d9b56a);box-shadow:0 4px 10px rgba(0,0,0,.5);animation:fall 1.1s .25s cubic-bezier(.5,0,1,.6) forwards}
.stumps i:nth-child(1){left:22px}.stumps i:nth-child(2){left:52px;animation-delay:.35s}.stumps i:nth-child(3){left:82px}
@keyframes fall{to{transform:translate(-34px,34px) rotateZ(-78deg) rotateX(55deg);opacity:.15}}
.stumps b{position:absolute;left:20px;top:10px;width:78px;height:8px;border-radius:4px;background:var(--gold);animation:bail 1s .2s ease-out forwards}
@keyframes bail{to{transform:translate(70px,-60px) rotateZ(540deg) rotateX(360deg);opacity:0}}
#ev .k{font-size:150px;font-weight:800;line-height:.95;letter-spacing:.04em;text-shadow:0 6px 24px rgba(0,0,0,.55)}
#ev .d{font-size:38px;font-weight:600;color:var(--ice);opacity:.9;margin-top:6px;letter-spacing:.05em}
#ev.four{--acc:var(--grn)}#ev.four .k{color:var(--grn)}
#ev.six{--acc:var(--vio)}#ev.six .k{color:#d8c8ff}
#ev.wkt{--acc:var(--red)}#ev.wkt .k{color:var(--red)}
#ev.mile{--acc:var(--gold)}#ev.mile .k{color:var(--gold)}
#ev.ovr .k{font-size:90px}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,var(--acc) 130%)}
#flash.on{animation:fl 1.1s ease-out}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
/* setup */
#setup{display:none;position:fixed;inset:0;background:#061029;padding:24px;font-family:Barlow,Arial,sans-serif;overflow:auto}
#setup h1{font:800 34px 'Barlow Condensed';color:var(--gold);margin:0 0 6px}
#setup p{color:var(--mute);margin:0 0 16px;font-size:15px}
#setup input{width:100%;padding:12px;margin:0 0 10px;border-radius:10px;border:1px solid #2a4a99;background:#0b1c4a;color:#fff;font-size:16px}
#setup button{padding:12px 18px;border:0;border-radius:10px;background:var(--gold);font-weight:700;font-size:16px}
#out{margin-top:14px;word-break:break-all;color:#9fe;font-size:14px}
@media (prefers-reduced-motion:reduce){.glass::after{animation:none}}
</style></head><body>
<div id="stage">
 <div id="flash"></div>
 <div id="ev" class="glass"><div id="evx"></div><div class="k" id="evk"></div><div class="d" id="evd"></div></div>
 <div id="bug" class="glass">
  <div class="team">
   <div class="logo" id="logo">A</div>
   <div><div class="tn" id="tn"></div><div class="vs" id="vs"></div><div class="sc" id="sc">0/0<small id="ov"></small></div></div>
  </div>
  <div class="mid">
   <div class="row h"><span>BATTER</span><span>R</span><span>B</span><span>4s</span><span>6s</span><span>SR</span></div>
   <div id="bats"></div>
   <div class="bowl"><span id="bw"></span><div class="balls" id="balls"></div></div>
  </div>
  <div class="chips" id="chips"></div>
 </div>
</div>
<div id="setup">
 <h1>Cricket overlay setup</h1>
 <p>Paste the CricClubs match link once. You get one overlay link for Moblin.</p>
 <input id="sl" placeholder="CricClubs match link (contains matchId and clubId)">
 <input id="st" placeholder="Your team name">
 <input id="so" placeholder="Opponent name (optional)">
 <input id="sk" type="password" placeholder="Admin key (set on server) for the permanent link">
 <button onclick="mk()">Make overlay link</button>
 <div id="out"></div>
</div>
<script>
const Q=new URLSearchParams(location.search);
let matchId=Q.get('matchId'),clubId=Q.get('clubId');
const link=Q.get('link');
if(link){try{const u=new URL(link);matchId=u.searchParams.get('matchId')||matchId;clubId=u.searchParams.get('clubId')||clubId}catch(e){}}
const API=(Q.get('api')||location.origin).replace(/\/$/,'');
const AUTO=Q.get('auto');const EP=Q.get('ep')||(AUTO?'{api}/match?slot='+AUTO:link?'{api}/match?link='+encodeURIComponent(link):'{api}/match?league='+(Q.get('league')||'')+'&matchId={matchId}&clubId={clubId}');
const POLL=+(Q.get('poll')||4)*1000, DEMO=Q.get('demo')==='1'&&!Q.get('live');
const TEAM=(Q.get('team')||'HOME').toUpperCase(), OPP=(Q.get('opp')||'AWAY').toUpperCase();
if(Q.get('accent'))document.documentElement.style.setProperty('--acc','#'+Q.get('accent'));
const $=id=>document.getElementById(id);
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);const st=$('stage').style;st.transform=`scale(${s})`;st.left=(innerWidth-1920*s)/2+'px';st.top=(innerHeight-1080*s)/2+'px'}
addEventListener('resize',fit);fit();

/* one-link setup */
function mk(){const u=new URL(location.href.split('?')[0]);u.searchParams.set('link',$('sl').value.trim());u.searchParams.set('api',location.origin);
 if($('st').value)u.searchParams.set('team',$('st').value);if($('so').value)u.searchParams.set('opp',$('so').value);
 $('out').textContent=u.toString();
 if($('sk').value)fetch(location.origin+'/set?key='+encodeURIComponent($('sk').value)+'&link='+encodeURIComponent($('sl').value.trim())).then(r=>r.json()).then(j=>{$('out').textContent=j.ok?'Current match set. PERMANENT Moblin link (never changes): '+location.origin+'/?auto=1':'Error: '+(j.error||'')})}
if(!matchId&&!DEMO&&!Q.get('demo')&&!AUTO){$('setup').style.display='block';$('stage').style.display='none'}

/* data adapter: maps CricClubs / proxy JSON to one shape */
const g=(o,ks,d)=>{if(o)for(const k of ks)if(o[k]!=null&&o[k]!=='')return o[k];return d};
const ballsOf=o=>{const [a,b]=String(o).split('.');return (+a||0)*6+(+b||0)};
function norm(j){
 const m=j.data||j.match||j.live||j;
 const bats=g(m,['batters','batsmen','currentBatsmen','batting'],[]).slice(0,2).map(b=>({
  n:g(b,['name','playerName','batsmanName','player'],'-'),r:+g(b,['runs','r'],0),b:+g(b,['balls','b','ballsFaced'],0),
  f:+g(b,['fours','4s'],0),s:+g(b,['sixes','6s'],0),st:!!g(b,['onStrike','strike','isStriker'],false)}));
 const bw=g(m,['bowler','currentBowler'],{});
 return{logo:g(m,['logo'],''),status:String(g(m,['status'],'')),team:g(m,['battingTeam','team'],TEAM),opp:g(m,['bowlingTeam','opp'],OPP),inn:+g(m,['innings','inningsNo'],1),
  runs:+g(m,['runs','score','totalRuns','total'],0),wk:+g(m,['wickets','wkts'],0),ov:String(g(m,['overs','oversBowled'],'0.0')),
  max:+g(m,['maxOvers','totalOvers','matchOvers'],20),target:+g(m,['target'],0),bats,
  bowl:{n:g(bw,['name','playerName'],'-'),o:g(bw,['overs','o'],'0.0'),r:g(bw,['runs','r'],0),w:g(bw,['wickets','w'],0)},
  over:g(m,['thisOver','currentOver','recentBalls'],[]).map(x=>String(typeof x==='object'?g(x,['display','label','runs'],'0'):x)),
  ship:g(m,['partnership'],''),lastW:g(m,['lastWicket','lastWkt'],'')}}

/* render */
let prev=null,queue=[],busy=false;
const bcls=x=>x==='4'?'f':x==='6'?'s':/^W$/i.test(x)?'w':/wd|nb|lb|b/i.test(x)?'x':'';
function render(s){
 $('tn').textContent=(s.team||TEAM).toUpperCase();
 $('vs').textContent=`vs ${(s.opp||OPP).toUpperCase()}  ·  ${s.inn==1?'1ST':'2ND'} INNINGS`;
 const lg=Q.get('logo')||s.logo;$('logo').innerHTML=lg?`<img src="${lg}">`:(s.team||TEAM)[0];
 const sc=`${s.runs}/${s.wk}`;if($('sc').firstChild.nodeValue!==sc){$('sc').firstChild.nodeValue=sc;$('sc').classList.remove('pop');void $('sc').offsetWidth;$('sc').classList.add('pop')}
 $('ov').textContent=`${s.ov} / ${s.max} OV`;
 $('bats').innerHTML=s.bats.map(b=>`<div class="row bt ${b.st?'st':''}"><span>${b.n}</span><span class="r">${b.r}</span><span>${b.b}</span><span>${b.f}</span><span>${b.s}</span><span>${b.b?(b.r*100/b.b).toFixed(0):'0'}</span></div>`).join('');
 $('bw').innerHTML=`<b>${s.bowl.n}</b>  ${s.bowl.o}-${s.bowl.r}-${s.bowl.w}`;
 $('balls').innerHTML=s.over.slice(-8).map(x=>`<div class="ball ${bcls(x)}">${x==='0'?'·':x}</div>`).join('');
 const b=ballsOf(s.ov),crr=b?s.runs*6/b:0,left=s.max*6-b;
 const c=[['CRR',crr.toFixed(2)]];
 if(s.inn>1&&s.target){c.push(['RRR',left>0?((s.target-s.runs)*6/left).toFixed(2):'-']);c.push(['TARGET',s.target]);c.push(['NEED',`${Math.max(s.target-s.runs,0)} / ${left}`])}
 else{c.push(['PROJECTED',Math.round(crr*s.max)]);c.push(['OVERS LEFT',(Math.floor(left/6))+'.'+(left%6)]);c.push(['WICKETS LEFT',10-s.wk])}
 $('chips').innerHTML=c.map(x=>`<div class="chip"><i>${x[0]}</i><b>${x[1]}</b></div>`).join('')+(s.ship?`<div class="chip w"><i>PARTNERSHIP</i><b>${s.ship}</b></div>`:'');
 $('bug').classList.add('on');
}
/* events */
function detect(a,s){
 if(!a)return;
 if(s.inn>a.inn&&s.target)push('mile','TARGET '+s.target,`${(s.team||TEAM).toUpperCase()} need ${s.target} from ${s.max*6} balls`);
 if(/won|tied|no result/i.test(s.status)&&s.status!==a.status)push('mile','MATCH OVER',s.status);
 if(s.wk>a.wk)push('wkt','WICKET!',s.lastW||`${s.runs}/${s.wk}`);
 else{const d=s.runs-a.runs,nb=ballsOf(s.ov)-ballsOf(a.ov);
  if(d===6&&nb===1)push('six','SIX!',s.bats.find(b=>b.st)?.n||'');
  else if(d===4&&nb===1)push('four','FOUR!',s.bats.find(b=>b.st)?.n||'');}
 s.bats.forEach(b=>{const o=a.bats.find(x=>x.n===b.n);if(o){[50,100].forEach(m=>{if(o.r<m&&b.r>=m)push('mile',m+' UP!',`${b.n} · ${b.r} (${b.b})`)})}});
 const ob=ballsOf(s.ov);if(ob%6===0&&ob>0&&ob>ballsOf(a.ov))push('ovr','END OF OVER '+ob/6,`${s.runs}/${s.wk}`);
}
function push(t,k,d){queue.push({t,k,d});if(!busy)next()}
function next(){const e=queue.shift();if(!e){busy=false;return}busy=true;
 const ev=$('ev');ev.className='glass '+e.t;$('evk').textContent=e.k;$('evx').innerHTML=e.t==='wkt'?'<div class="stumps"><i></i><i></i><i></i><b></b></div>':(e.t==='four'||e.t==='six')?'<div class="ball3d"></div>':'';$('evd').textContent=e.d;
 if(e.t!=='ovr'){$('flash').className='';void $('flash').offsetWidth;$('flash').className='on';$('flash').style.setProperty('--acc',getComputedStyle(ev).getPropertyValue('--acc'))}
 requestAnimationFrame(()=>ev.classList.add('on'));
 setTimeout(()=>{ev.classList.remove('on');setTimeout(next,600)},e.t==='ovr'?2800:3800)}
function update(s){detect(prev,s);prev=s;render(s)}

/* sources */
async function poll(){
 try{const url=EP.replace('{api}',API).replace('{matchId}',matchId).replace('{clubId}',clubId);
  const r=await fetch(url,{cache:'no-store'});update(norm(await r.json()))}catch(e){console.warn('sync failed',e)}
 setTimeout(poll,POLL)}
function demo(){
 const s={team:TEAM,opp:OPP,inn:1,runs:89,wk:2,ov:'10.0',max:20,target:0,ship:'15(9)',lastW:'Sreejith Mk · 25 (16)',
  bats:[{n:'Harsha There',r:44,b:31,f:4,s:2,st:true},{n:'Ravi Devanur',r:9,b:5,f:0,s:1,st:false}],
  bowl:{n:'Veera',o:'0.0',r:0,w:0},over:[]};
 const outs=['0','1','1','2','4','6','W','1','0','4'];let i=0;
 update(JSON.parse(JSON.stringify(s)));
 setInterval(()=>{const o=outs[i++%outs.length];let b=ballsOf(s.ov)+1;s.ov=Math.floor(b/6)+'.'+b%6;
  if(b%6===1)s.over=[];s.over.push(o);const st=s.bats.find(x=>x.st);st.b++;
  if(o==='W'){s.wk++;s.bats[s.bats.indexOf(st)].n='New Batter';st.r=0;st.b=0}else{const n=+o;s.runs+=n;st.r+=n;if(n==4)st.f++;if(n==6)st.s++;if(n%2){s.bats.forEach(x=>x.st=!x.st)}}
  update(JSON.parse(JSON.stringify(s)))},4500)}
if((matchId||AUTO)&&!DEMO)poll();else if(DEMO||Q.get('demo'))demo();
</script></body></html>
